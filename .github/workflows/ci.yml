name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: install (frozen lockfile)
        run: yarn install --immutable

      - name: typecheck
        run: yarn typecheck

      - name: build (compiles + obfuscates dist)
        run: yarn build

      - name: test
        run: yarn test
